name: iPhoneStudio
options:
  deploymentTarget:
    iOS: '16.0'
targets:
  iPhoneStudio:
    type: application
    platform: iOS
    sources:
      - Studio.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.iphonestudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Camera preview and recording
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio with video
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to the desktop camera controller
        SWIFT_VERSION: '5.0'
